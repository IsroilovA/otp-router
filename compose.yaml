services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: otp_router
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: otp_router
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otp_router -d otp_router"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  postgres-data:
