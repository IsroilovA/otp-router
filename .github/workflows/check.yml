name: Check and release
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  distribution:
    needs: check
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - if: matrix.runner == 'ubuntu-latest'
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - if: matrix.runner == 'ubuntu-latest'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - if: matrix.runner == 'ubuntu-latest'
        run: pnpm install --frozen-lockfile
      - if: matrix.runner == 'ubuntu-latest'
        run: pnpm build
      - if: matrix.runner == 'ubuntu-latest'
        run: pnpm --filter @otp-router/client pack:check
      - run: docker build -f apps/server/Dockerfile -t otp-router:smoke .
      - run: scripts/docker-smoke.sh otp-router:smoke

  server:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: distribution
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: publish-server
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: node scripts/release/plan.ts server
      - if: steps.plan.outputs.state != 'skip'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: steps.plan.outputs.state != 'skip'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.plan.outputs.state != 'skip'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check exact image
        if: steps.plan.outputs.state != 'skip'
        id: image
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_STATE: ${{ steps.plan.outputs.state }}
          IMAGE: ghcr.io/isroilova/otp-router
        run: |
          if docker buildx imagetools inspect --raw "$IMAGE:$VERSION" > "$RUNNER_TEMP/manifest.json" 2> "$RUNNER_TEMP/inspect.err"; then
            node scripts/release/check-image.ts "$RUNNER_TEMP/manifest.json"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif rg -qi '404 Not Found|manifest unknown|not found' "$RUNNER_TEMP/inspect.err"; then
            if [ "$RELEASE_STATE" = recover ]; then
              echo 'A tag exists at this commit, but the exact image is absent' >&2
              exit 1
            fi
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/inspect.err" >&2
            exit 1
          fi
      - name: Publish exact multi-architecture image
        if: steps.plan.outputs.state != 'skip' && steps.image.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/isroilova/otp-router:${{ steps.plan.outputs.version }}
          annotations: |
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.source=https://github.com/IsroilovA/otp-router
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/IsroilovA/otp-router
      - name: Verify image and update channel
        if: steps.plan.outputs.state != 'skip'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
          IMAGE: ghcr.io/isroilova/otp-router
        run: |
          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" > "$RUNNER_TEMP/manifest.json"
          node scripts/release/check-image.ts "$RUNNER_TEMP/manifest.json"
          docker buildx imagetools create -t "$IMAGE:$CHANNEL" "$IMAGE:$VERSION"
      - name: Build release assets
        if: steps.plan.outputs.state != 'skip'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          IMAGE: ghcr.io/isroilova/otp-router
        run: |
          pnpm build
          node apps/server/dist/main.js --openapi > openapi.json
          docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:$VERSION" > "$RUNNER_TEMP/digest"
          node scripts/release/write-digest.ts "$RUNNER_TEMP/digest" > image-digest.txt
          sha256sum openapi.json image-digest.txt > SHA256SUMS
      - name: Create server tag and GitHub Release
        if: steps.plan.outputs.state != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
          PREVIOUS_TAG: ${{ steps.plan.outputs.previous_tag }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > /dev/null
          fi
          node scripts/release/github-release.ts server

  client:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-client
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - id: plan
        run: node scripts/release/plan.ts client
      - if: steps.plan.outputs.state != 'skip'
        run: npm install --global npm@11.20.0
      - if: steps.plan.outputs.state != 'skip'
        run: pnpm build
      - name: Pack published bytes
        if: steps.plan.outputs.state != 'skip'
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          node ../../scripts/release/read-pack.ts "$RUNNER_TEMP/pack.json"
        working-directory: packages/client
      - name: Check exact npm version and publish if absent
        if: steps.plan.outputs.state != 'skip'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_STATE: ${{ steps.plan.outputs.state }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
        run: |
          if npm view "@otp-router/client@$VERSION" dist.integrity --registry=https://registry.npmjs.org > "$RUNNER_TEMP/registry-integrity" 2> "$RUNNER_TEMP/npm-view.err"; then
            node scripts/release/check-integrity.ts "$RUNNER_TEMP/registry-integrity" "$RUNNER_TEMP/pack.json"
          elif rg -q 'E404' "$RUNNER_TEMP/npm-view.err"; then
            if [ "$RELEASE_STATE" = recover ]; then
              echo 'A tag exists at this commit, but the exact npm version is absent' >&2
              exit 1
            fi
            npm publish "$RUNNER_TEMP/otp-router-client-$VERSION.tgz" --access public --tag "$CHANNEL"
          else
            cat "$RUNNER_TEMP/npm-view.err" >&2
            exit 1
          fi
      - name: Create client tag and GitHub Release
        if: steps.plan.outputs.state != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
          PREVIOUS_TAG: ${{ steps.plan.outputs.previous_tag }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > /dev/null
          fi
          node scripts/release/github-release.ts client
